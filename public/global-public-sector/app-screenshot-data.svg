<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#080808"/>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="rgba(0,0,0,0.7)"/>
    </filter>
  </defs>

  <!-- Floating card -->
  <rect x="72" y="52" width="656" height="396" rx="16" fill="#1C1C1C" stroke="rgba(255,255,255,0.14)" stroke-width="1" filter="url(#shadow)"/>

  <g transform="translate(72, 52)">

    <!-- ── NAV HEADER ── -->
    <text x="16" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#DDDDDD">✦</text>
    <text x="34" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="500" fill="#DDDDDD">Insights</text>
    <text x="72" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#333">/</text>
    <text x="82" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#666">Housing Market vs. Delivery</text>
    <text x="432" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#555">Overview</text>
    <text x="488" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#AAAAAA">Legislation</text>
    <rect x="488" y="31" width="60" height="2" rx="1" fill="#777"/>
    <text x="558" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#555">Data</text>

    <!-- Nav divider -->
    <rect x="0" y="36" width="656" height="1" fill="rgba(255,255,255,0.07)"/>

    <!-- Panel divider -->
    <rect x="420" y="37" width="1" height="358" fill="rgba(255,255,255,0.07)"/>

    <!-- Right panel tint -->
    <rect x="421" y="37" width="234" height="358" fill="rgba(0,0,0,0.12)"/>

    <!-- ── LEFT PANEL ── -->

    <!-- Title -->
    <text x="20" y="56" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="500" fill="#DDDDDD">Housing Market vs. Delivery</text>

    <!-- Tag: High Priority -->
    <rect x="20" y="63" width="72" height="16" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
    <text x="56" y="75" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#AAAAAA" text-anchor="middle">High Priority</text>

    <!-- Tag: Policy Review -->
    <rect x="98" y="63" width="72" height="16" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="134" y="75" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#777" text-anchor="middle">Policy Review</text>

    <!-- Current Performance -->
    <text x="20" y="98" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#DDDDDD">Current Performance</text>
    <text x="20" y="111" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#666">National authority exceeded targets: 34,506 new units</text>
    <text x="20" y="123" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#666">and 38,872 completions — up 6% and 12% year-on-year.</text>
    <text x="20" y="135" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#666">Affordable delivery reached 204,000 homes.</text>

    <!-- Market Challenges -->
    <text x="20" y="153" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#DDDDDD">Market Challenges</text>
    <text x="20" y="166" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#666">125,000 permits approved in year to March 2025,</text>
    <text x="20" y="178" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#666">down 8% — below the 340,000 annual target.</text>

    <!-- Macroeconomic Impact -->
    <text x="20" y="196" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#DDDDDD">Macroeconomic Impact</text>
    <text x="20" y="209" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#666">Delivery shortfalls expected to grow 4% through 2025.</text>
    <text x="20" y="221" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#666">Northern regions outperforming the south.</text>

    <!-- Sources -->
    <text x="20" y="239" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#666" letter-spacing="0.1em">SOURCES</text>

    <rect x="20" y="248" width="218" height="17" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <rect x="26" y="253" width="5" height="5" rx="1" fill="#555"/>
    <text x="37" y="260" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#666">housebuilding-annual-statistics.pdf</text>

    <rect x="20" y="270" width="244" height="17" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <rect x="26" y="275" width="5" height="5" rx="1" fill="#555"/>
    <text x="37" y="282" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#666">housing-delivery-test-results-2024.pdf</text>

    <rect x="20" y="292" width="208" height="17" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <rect x="26" y="297" width="5" height="5" rx="1" fill="#555"/>
    <text x="37" y="304" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#666">housing-supply-economic-indicators</text>

    <!-- Geographic Breakdown -->
    <text x="20" y="322" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#666" letter-spacing="0.1em">GEOGRAPHIC BREAKDOWN</text>

    <!-- Map -->
    <rect x="20" y="330" width="390" height="58" rx="6" fill="#232323" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <line x1="20" y1="349" x2="410" y2="349" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    <line x1="20" y1="368" x2="410" y2="368" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    <line x1="98"  y1="330" x2="98"  y2="388" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    <line x1="176" y1="330" x2="176" y2="388" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    <line x1="254" y1="330" x2="254" y2="388" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    <line x1="332" y1="330" x2="332" y2="388" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    <!-- Connections -->
    <line x1="152" y1="359" x2="196" y2="345" stroke="rgba(255,255,255,0.12)" stroke-width="0.7"/>
    <line x1="152" y1="359" x2="114" y2="351" stroke="rgba(255,255,255,0.10)" stroke-width="0.7"/>
    <line x1="152" y1="359" x2="234" y2="367" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <line x1="152" y1="359" x2="100" y2="373" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
    <line x1="196" y1="345" x2="290" y2="349" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>
    <!-- Nodes -->
    <circle cx="152" cy="359" r="4.5" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.40)" stroke-width="1"/>
    <circle cx="196" cy="345" r="3"   fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.28)" stroke-width="0.7"/>
    <circle cx="114" cy="351" r="2.5" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.22)" stroke-width="0.6"/>
    <circle cx="234" cy="367" r="2.5" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.20)" stroke-width="0.6"/>
    <circle cx="100" cy="373" r="2"   fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.18)" stroke-width="0.5"/>
    <circle cx="290" cy="349" r="2"   fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.18)" stroke-width="0.5"/>
    <!-- Labels -->
    <text x="159" y="362" font-family="-apple-system, system-ui, sans-serif" font-size="7.5" fill="#AAAAAA">Capital</text>
    <text x="202" y="343" font-family="-apple-system, system-ui, sans-serif" font-size="7" fill="#555">North</text>
    <text x="86"  y="350" font-family="-apple-system, system-ui, sans-serif" font-size="7" fill="#555">West</text>
    <text x="240" y="371" font-family="-apple-system, system-ui, sans-serif" font-size="7" fill="#555">East</text>
    <text x="294" y="353" font-family="-apple-system, system-ui, sans-serif" font-size="7" fill="#555">Northeast</text>

    <!-- ── RIGHT PANEL ── -->

    <!-- Ask AI header -->
    <text x="436" y="56" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="500" fill="#DDDDDD">Ask AI</text>
    <rect x="428" y="63" width="220" height="1" fill="rgba(255,255,255,0.07)"/>

    <!-- Intro message -->
    <text x="436" y="77" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#666">Here are 2 proactive legislative</text>
    <text x="436" y="89" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#666">options you might consider:</text>

    <!-- Card 1 -->
    <rect x="428" y="98" width="220" height="50" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="438" y="115" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#AAAAAA">Fast-track approval for</text>
    <text x="438" y="127" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#AAAAAA">standardised housing designs</text>
    <text x="438" y="140" font-family="-apple-system, system-ui, sans-serif" font-size="8.5" fill="#555">Regulatory Efficiency</text>

    <!-- Card 2 -->
    <rect x="428" y="155" width="220" height="50" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="438" y="172" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#AAAAAA">Fund retraining programs for</text>
    <text x="438" y="184" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#AAAAAA">workers from declining industries</text>
    <text x="438" y="197" font-family="-apple-system, system-ui, sans-serif" font-size="8.5" fill="#555">Financial and Social Support</text>

    <!-- Card 3 -->
    <rect x="428" y="212" width="220" height="50" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="438" y="229" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#AAAAAA">Establish government-backed</text>
    <text x="438" y="241" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#AAAAAA">development finance</text>
    <text x="438" y="254" font-family="-apple-system, system-ui, sans-serif" font-size="8.5" fill="#555">Financial Industries</text>

    <!-- Divider -->
    <rect x="428" y="271" width="220" height="1" fill="rgba(255,255,255,0.06)"/>

    <!-- Q&A prompts -->
    <text x="436" y="286" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#555">What are ways to alleviate this?</text>
    <rect x="428" y="292" width="220" height="0.5" fill="rgba(255,255,255,0.05)"/>
    <text x="436" y="306" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#555">What is the government's protocol?</text>
    <rect x="428" y="312" width="220" height="0.5" fill="rgba(255,255,255,0.05)"/>
    <text x="436" y="326" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#555">Who are the key decision makers?</text>

    <!-- Footer -->
    <rect x="428" y="370" width="220" height="1" fill="rgba(255,255,255,0.06)"/>
    <text x="436" y="386" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#555">Type...</text>
    <text x="640" y="386" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#444" text-anchor="end">↵</text>

